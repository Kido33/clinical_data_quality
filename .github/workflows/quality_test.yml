name: Clinical Data Quality Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinical_dq
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d clinical_dq"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. Setup Java
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Install Python dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install python-dotenv
          pip install sqlalchemy
          pip install psycopg2-binary
          pip install pytest


      # ============================================================
      # 5. Download Synthea
      # ============================================================

      - name: Download Synthea
        run: |
          mkdir -p tools/synthea

          curl -L \
            -o tools/synthea/synthea-with-dependencies.jar \
            https://github.com/synthetichealth/synthea/releases/download/master-branch-latest/synthea-with-dependencies.jar


      # ============================================================
      # 6. Verify Synthea
      # ============================================================

      - name: Verify Synthea
        run: |
          java -jar tools/synthea/synthea-with-dependencies.jar -h


      # ============================================================
      # 7. Generate Synthea synthetic data
      # ============================================================

      - name: Generate Synthea data
        run: |
          java -jar tools/synthea/synthea-with-dependencies.jar \
            -s 1788156358927 \
            -p 18 \
            --exporter.baseDirectory=tools/synthea/output/ \
            --exporter.csv.export=true \
            Massachusetts
            -r 20260831
            -e 20260831


      # ============================================================
      # 8. Verify generated Synthea data
      # ============================================================

      - name: Verify generated Synthea data
        run: |
          echo "Generated files:"
          find tools/synthea/output -maxdepth 3 -type f | sort

          echo ""
          echo "Checking required CSV files..."

          test -f tools/synthea/output/csv/patients.csv
          test -f tools/synthea/output/csv/encounters.csv
          test -f tools/synthea/output/csv/observations.csv

          echo "Required Synthea CSV files exist."


      # ============================================================
      # 9. Configure database environment
      # ============================================================

      - name: Configure database environment
        run: |
          echo "DB_USER=postgres" >> $GITHUB_ENV
          echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
          echo "DB_HOST=localhost" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "DB_NAME=clinical_dq" >> $GITHUB_ENV


      # ============================================================
      # 10. Run pipeline
      # ============================================================

      - name: Run quality pipeline
        run: |
          python src/run_pipeline.py


      # ============================================================
      # 11. Run automated tests
      # ============================================================

      - name: Run pytest
        run: |
          python -m pytest tests -v
